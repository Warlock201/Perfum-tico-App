name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    # FIX: Use the latest setup-android action and explicit tools version
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 11076708 # Use a known stable version

    - name: Accept Android licenses
      run: yes | sdkmanager --licenses || true

    - name: Configure strict memory limits for CI
      run: |
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Djava.awt.headless=true -XX:+UseG1GC" > gradle.properties
        echo "org.gradle.parallel=false" >> gradle.properties
        echo "org.gradle.daemon=false" >> gradle.properties
        echo "org.gradle.workers.max=1" >> gradle.properties
        echo "kotlin.daemon.jvmargs=-Xmx2048m" >> gradle.properties
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties

    - name: Create real google-services.json
      run: |
        cat << 'DUMMY' > app/google-services.json
        {
          "project_info": {
            "project_number": "784506326280",
            "project_id": "gestor-de-perfumes",
            "storage_bucket": "gestor-de-perfumes.firebasestorage.app"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:784506326280:android:51ee88760ea507fa7a70bd",
                "android_client_info": {
                  "package_name": "com.aistudio.perfumatico.kqpv"
                }
              },
              "oauth_client": [
                {
                  "client_id": "784506326280-h00f78bcrjlpnfhuqq2cg5u8u11t1ppe.apps.googleusercontent.com",
                  "client_type": 1,
                  "android_info": {
                    "package_name": "com.aistudio.perfumatico.kqpv",
                    "certificate_hash": "3924b3a691f4a5873901996092f1c8f555e0604a"
                  }
                },
                {
                  "client_id": "784506326280-i4dfu7es4v9575jdt13fa6upcubh5spe.apps.googleusercontent.com",
                  "client_type": 3
                }
              ],
              "api_key": [
                {
                  "current_key": "AIzaSyCwuvLttgonNXSaTH1XjJahNejIGaYhEA0"
                }
              ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": [
                    {
                      "client_id": "784506326280-i4dfu7es4v9575jdt13fa6upcubh5spe.apps.googleusercontent.com",
                      "client_type": 3
                    }
                  ]
                }
              }
            }
          ],
          "configuration_version": "1"
        }
        DUMMY

    - name: Create .env properties file
      run: |
        touch .env
        echo "GEMINI_API_KEY=dummy_key" >> .env
        echo "GEMINI_API_KEY_NEW=dummy_key" >> .env

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Generate dummy debug keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Build Debug APK
      run: |
        ./gradlew :app:assembleDebug --no-daemon --stacktrace

    - name: Copy generated APK to releases
      run: |
        mkdir -p releases
        if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
          cp app/build/outputs/apk/debug/app-debug.apk releases/perfumatico-v4.5.apk
        fi

    - name: Commit and Push Release
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add releases/
        git commit -m "chore: auto-update release apk" || echo "No changes to commit"
        # We need a PAT token to push back to the repo securely, standard GITHUB_TOKEN might be restricted.
        # But we will try anyway.
        git push || echo "Push failed, probably due to branch protection or token scopes"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Perfumatico-App-Debug
        path: releases/perfumatico-v4.5.apk
