name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Configure strict memory limits for CI
      run: |
        echo "org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -Djava.awt.headless=true -XX:+HeapDumpOnOutOfMemoryError" > gradle.properties
        echo "org.gradle.parallel=false" >> gradle.properties
        echo "org.gradle.daemon=false" >> gradle.properties
        echo "org.gradle.workers.max=1" >> gradle.properties
        echo "kotlin.daemon.jvmargs=-Xmx1g" >> gradle.properties
        echo "android.useAndroidX=true" >> gradle.properties

    - name: Create dummy google-services.json
      run: |
        cat << 'DUMMY' > app/google-services.json
        {
          "project_info": { "project_number": "123", "project_id": "dummy" },
          "client": [ {
            "client_info": { "mobilesdk_app_id": "1:123:android:abc", "android_client_info": { "package_name": "com.aistudio.perfumatico.kqpv" } },
            "api_key": [ { "current_key": "dummy" } ]
          } ]
        }
        DUMMY
    - name: Create .env properties file
      run: |
        touch .env
        echo "GEMINI_API_KEY=dummy_key" >> .env
        echo "GEMINI_API_KEY_NEW=dummy_key" >> .env

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew :app:assembleDebug --no-daemon --stacktrace || {
          echo "Gradle build failed with exit code $?. Checking for OOM in dmesg:"
          sudo dmesg | tail -n 50
          exit 1
        }

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Perfumatico-App-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
